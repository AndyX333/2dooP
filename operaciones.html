
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones básicas</title>
     <link rel="stylesheet" href="disenio.css">
</head>
<body>
    <h1>Operaciones básicas</h1>

    <script>
        let N1 = Number(prompt("Introduce el primer número"));
        let N2 = Number(prompt("Introduce el segundo número"));

        let suma = N1 + N2;
        document.write("El valor de la suma es: " + suma + "<br>");

        let resta = N1 - N2;
        document.write("El valor de la resta es: " + resta + "<br>");

        let multi = N1 * N2;
        document.write("El valor de la multiplicación es: " + multi + "<br>");

        let div = N1 / N2;
        document.write("El valor de la división es: " + div);
    </script>
    <a href="index.html">Regresar a Index</a>
</body>
</html>
