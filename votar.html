
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Votaciones</title>
     <link rel="stylesheet" href="disenio.css">
</head>
<body>
    <script>
        let continuar = confirm("¿Deseas votar?");
        let edad = Number(prompt("Ingresa tu edad"));

        if (continuar) {
            if (edad >= 18) {
                document.write("¡Felicidades, puedes votar!");
            } else {
                document.write("No puedes votar, eres menor de edad");
            }
        }
    </script>
    <a href="index.html">Regresar a Index</a>
</body>
</html>
