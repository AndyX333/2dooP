
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promedio</title>
    <link rel="stylesheet" href="disenio.css">
</head>
<body>
    <script>
        let C1 = Number(prompt("Introduce la primera calificación"));
        let C2 = Number(prompt("Introduce la segunda calificación"));
        let C3 = Number(prompt("Introduce la tercera calificación"));

        let promedio = (C1 + C2 + C3) / 3;

        document.write("Tu promedio es: " + promedio + "<br>");

        if (promedio >= 6) {
            document.write("Felicidades, pasaste.");
        } else {
            document.write("No pasaste, esfuérzate.");
        }
    </script>
    <a href="index.html">Regresar a Index</a>
</body>
</html>
